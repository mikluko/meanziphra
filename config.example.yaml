# Полный пример конфигурации meanziphra. Относительные пути отсчитываются от каталога этого файла.
# Использование: go run ./cmd/mz -c config.example.yaml issue

anchor:
  # CN якоря. По нему install и uninstall находят свои сертификаты в связке ключей.
  # По умолчанию: meanziphra.
  name: Минцифры на поводке

  # Закрытый ключ якоря.
  #   не задан            эфемерный ключ: живёт только в памяти во время issue, каждый issue выпускает новый якорь
  #   anchor.key          путь к файлу; отсутствующий файл будет создан с правами 0600
  #   file://anchor.key   то же самое
  #   op://Vault/Item/key ссылка на 1Password, читается через `op read`; запись должна существовать
  # С постоянным ключом якорь переиспользуется, пока не изменится набор зон доменов всех категорий.
  key: anchor.key

# Каталог для выпущенных сертификатов: anchor.crt и cat-<категория>.crt. По умолчанию: build.
out: build

# Чужие корневые УЦ, которые нужно ограничить.
roots:
  - name: nca

    # Сертификат корня в PEM или DER.
    cert: inputs/russian-trusted-root-ca.pem

    # Откуда fetch скачивает cert. Необязательно.
    url: https://gu-st.ru/content/Other/doc/russian_trusted_root_ca.cer

    # SHA-256 сертификата корня. Обязательно: issue, fetch и update отказываются работать с другим сертификатом.
    sha256: D2:6D:2D:02:31:B7:C3:9F:92:CC:73:85:12:BA:54:10:35:19:E4:40:5D:68:B5:BD:70:3E:97:88:CA:8E:CF:31

    # Журналы Certificate Transparency, из которых update берёт имена сертификатов этого корня. Необязательно.
    ct:
      # Базовые URL журналов RFC 6962.
      logs:
        - https://27.ctlog.digital.gov.ru/2027/
      # Файл, где update хранит прочитанные позиции журналов и найденные имена с владельцами.
      state: inputs/ct-state.json
      # Зоны, имена в которых раскладываются по категориям; остальные update только считает.
      tlds: [ru, su, xn--p1ai]

# Разметка владельцев по категориям. Нужна, если у корня есть ct.
# update берёт ключ TypeSafe из переменной окружения TYPESAFE_API_KEY.
classify:
  # Кэш разметки; модель спрашивают только о владельцах, которых в нём нет.
  # Смена модели, инструкций или описаний категорий сбрасывает кэш.
  cache: inputs/classification.json
  # Шаблон text/template для permit_file категорий; получает .Category и .Domains.
  template: inputs/categories.tpl
  # Модель TypeSafe.
  model: jev-1.13.0
  # Ответ с меньшей уверенностью помечается review: true.
  min_confidence: 0.6
  # Вопрос модели. Строка или структура; уходит в API как есть.
  instructions:
    вопрос: К какой категории относится юридический владелец этих сайтов?

# Категории. На каждую непустую issue выпускает кросс-сертификат cat-<name>.crt; пустая пропускается.
categories:
  - # Имя категории.
    name: banks

    # Корень из roots, который ограничивает категория.
    root: nca

    # Что входит в категорию. Категория с описанием участвует в разметке, и update переписывает её permit_file.
    description: Банки и другие финансовые организации.

    # Домены, заданные вручную. Каждый домен разрешает и все свои поддомены.
    permit: [sberbank.ru]

    # Файл с доменами, по одному в строке; строки с # пропускаются. Отсутствующий файл считается пустым.
    # Домены из permit и permit_file объединяются.
    permit_file: inputs/categories/banks.txt

    # Хосты, на которых check проверяет выпущенные сертификаты: allow должны пройти, deny должны быть отвергнуты.
    check:
      allow: [sberbank.ru, online.sberbank.ru]
      deny: [alfabank.com]

  - name: other
    root: nca
    description: Всё остальное.
    permit_file: inputs/categories/other.txt
