name: Release

# Релиз режется, когда у новейшей версии в CHANGELOG.md ещё нет тега vA.B.C. Изменение входных данных — тоже
# изменение кода: агент релизов поднимает на нём patch-версию.
# Тег и релиз создаются в одном workflow, потому что тег, запушенный с GITHUB_TOKEN, не запускает другие workflow.
on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Read the changelog
        id: changelog
        uses: mikluko/action-changelog@v1

      - name: Whether a release is due
        id: cut
        env:
          VALID: ${{ steps.changelog.outputs.valid }}
          VERSION: ${{ steps.changelog.outputs.version }}
          TAGGED: ${{ steps.changelog.outputs.already-tagged }}
          PRERELEASE: ${{ steps.changelog.outputs.prerelease }}
        run: |
          if [ "$VALID" != true ] || [ "$TAGGED" != false ] || [ "$PRERELEASE" != false ] || [ -z "$VERSION" ]; then
            echo "due=false" >>"$GITHUB_OUTPUT"
            echo "nothing to cut: valid=$VALID already-tagged=$TAGGED prerelease=$PRERELEASE version=${VERSION:-none}"
            exit 0
          fi
          {
            echo "due=true"
            echo "tag=v$VERSION"
            echo "date=$(date -u +%Y-%m-%d)"
          } >>"$GITHUB_OUTPUT"

      - if: steps.cut.outputs.due == 'true'
        run: go test ./...

      # Сертификаты выпускаются только для проверки и в релиз не попадают: якорь пользователь выпускает сам.
      - name: Issue the certificates
        if: steps.cut.outputs.due == 'true'
        run: go run ./cmd/mz -c config.release.yaml issue -insecure

      - name: Check them against live hosts
        if: steps.cut.outputs.due == 'true'
        run: go run ./cmd/mz -c config.release.yaml check

      # Тег ставится до сборки: Go вшивает версию модуля из git, и сборка с тега должна дать тот же бинарник.
      - name: Tag locally
        if: steps.cut.outputs.due == 'true'
        env:
          TAG: ${{ steps.cut.outputs.tag }}
        run: git tag "$TAG"

      - name: Build the binaries
        if: steps.cut.outputs.due == 'true'
        run: make binaries

      - name: Render the install scripts
        if: steps.cut.outputs.due == 'true'
        env:
          TAG: ${{ steps.cut.outputs.tag }}
        run: go run ./cmd/mz -c config.release.yaml render -tag "$TAG"

      - name: Attest the release files
        if: steps.cut.outputs.due == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            build/mz-*
            build/*.sh

      - name: Push the tag
        if: steps.cut.outputs.due == 'true'
        env:
          TAG: ${{ steps.cut.outputs.tag }}
        run: git push origin "refs/tags/$TAG"

      - name: Publish the release
        if: steps.cut.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.cut.outputs.tag }}
          DATE: ${{ steps.cut.outputs.date }}
          NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          {
            printf 'Список доменов на %s.\n\n' "$DATE"
            printf '%s\n' "$NOTES"
          } >"$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" build/mz-* build/*.sh
