name: Release agent

# Раз в день собирает открытые PR с меткой bot в стек, кладёт сверху ветку релиза с CHANGELOG и сливает стек в main.
# Агент — goose на Kimi K3; порядок его действий — в .github/release-agent.md.
on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Открыть PR релиза, но не сливать
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-agent
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Identify as the app
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"
      - name: Install gh stack
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh extension install github/gh-stack --pin v0.1.1
      # Ставит релиз aaif-goose/goose, сверив его аттестацию; сторонняя Action закреплена по коммиту v1.0.10.
      - uses: clouatre-labs/setup-goose-action@017d90271b50e0130dd915840135fed34aa7de36
        with:
          version: 1.53.0
      - name: Run the agent
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          GOOSE_PROVIDER: moonshot
          GOOSE_MODEL: k3
          # Ключ Kimi Code. Провайдер moonshot говорит по OpenAI-совместимому протоколу, который Kimi Code отдаёт
          # под /coding; без MOONSHOT_BASE_URL он ходит на api.moonshot.cn.
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MOONSHOT_BASE_URL: https://api.kimi.ai/coding
          GOOSE_MODE: auto
          GOOSE_DISABLE_KEYRING: "1"
          GOOSE_TELEMETRY_ENABLED: "false"
          GOOSE_MAX_TURNS: "200"
        run: goose run --no-session -i .github/release-agent.md
