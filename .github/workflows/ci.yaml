name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go run ./cmd/mz -c config.release.yaml issue -insecure
      - run: make binaries
      - run: go run ./cmd/mz -c config.release.yaml render -tag v0.0.0
      - run: go run ./cmd/mz bundle -insecure -o build/bundle banks
      - run: go run ./cmd/mz bundle -insecure -target linux -o build/bundle-linux banks
      - run: shellcheck -s bash build/*.sh build/bundle/*.sh build/bundle-linux/*.sh
      - uses: golangci/golangci-lint-action@v9

  changelog:
    runs-on: ubuntu-latest
    steps:
      # Проверкам по тегам нужна вся история, а checkout по умолчанию неглубокий и без тегов.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: mikluko/action-changelog@v1
